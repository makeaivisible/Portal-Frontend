name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate static prototype
        run: node scripts/validate.mjs
